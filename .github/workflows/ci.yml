name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The whole suite runs offline against samples/example-flow.json,
      # so CI needs no Genesys credentials.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild documents from the sample flow
        run: |
          python -m genesys_flow_doc --offline samples/example-flow.json --out ci-out
          python tools/validate.py ci-out

      - name: Upload the generated sample documents
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: sample-documents
          path: ci-out/
          retention-days: 14

  guarantees:
    name: read-only guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      # Runs on its own so a failure here is unmistakable in the checks list:
      # these are the tests that assert the tool cannot write to Genesys.
      - name: Assert the tool stays read-only
        run: python -m unittest tests.test_security -v

      - name: Fail if a mutating HTTP verb appears outside the token exchange
        run: |
          hits=$(grep -rnE '\.(post|put|patch|delete)\s*\(' genesys_flow_doc/ \
                 --include='*.py' | grep -v '^\s*#' | wc -l)
          echo "mutating call sites found: $hits"
          if [ "$hits" -ne 1 ]; then
            echo "::error::Expected exactly one (the OAuth token exchange in client.py)."
            grep -rnE '\.(post|put|patch|delete)\s*\(' genesys_flow_doc/ --include='*.py'
            exit 1
          fi

  secrets:
    name: no committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is committed. Remove it and rotate the credentials."
            exit 1
          fi
          echo "No tracked .env file."

      - name: Fail if a credential-shaped value is committed
        run: |
          # Genesys client ids and secrets are 32+ char url-safe strings; look
          # for them assigned to an obviously named variable in tracked files.
          if git grep -nIE '(client_secret|CLIENT_SECRET|api_key|API_KEY)\s*[=:]\s*["'"'"']?[A-Za-z0-9_\-]{24,}' \
             -- . ':(exclude).env.example'; then
            echo "::error::A hard-coded credential appears to be committed."
            exit 1
          fi
          echo "No hard-coded credentials found."
